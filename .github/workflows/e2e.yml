name: e2e

# Full cluster test on kind with OLM (operator/hack/kind-olm-test.sh): install
# the operator from a catalog, create a ReviewPlatform, and run a real review
# with the Claude Code CLI against a fake model API. About 7 minutes with a warm
# layer cache (15 cold), so it only runs when something that ships to a cluster
# changes, and before releases that were not already tested.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "operator/**"
      - "agent-runner/**"
      - "backend/eagle/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "Containerfile"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "agent-runner/**"
      - "backend/eagle/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "Containerfile"
      - ".github/workflows/e2e.yml"

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when run from release.yml, so a push
  # to main never cancels the e2e run that gates a release (or the reverse).
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CONTAINER_TOOL: docker
      KIND_VERSION: v0.33.0
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (continues in the background)
        # The images, their registry copies and the cluster's copies do not fit
        # on a standard runner disk ("no space left on device"). Drop toolchains
        # this job never uses. Deleting them takes about two minutes, so it runs
        # while the next steps set up Go, kind and the builder; the preinstalled
        # images are pruned first so the prune cannot race kind's node image.
        run: |
          df -h / | tail -1
          sudo docker image prune -af >/dev/null
          sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost \
            >/tmp/free-disk.log 2>&1 &

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Set up BuildKit
        # Host networking and plain http let the builder push to the test
        # registry on localhost:5001; layers are cached in the GitHub Actions cache.
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."localhost:5001"]
              http = true
              insecure = true

      - name: Expose the cache service to the build
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Install kind
        # The runner image ships a root owned kind in /usr/local/bin; install the
        # pinned version into a user directory that comes first on PATH.
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfLo "$HOME/.local/bin/kind" "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x "$HOME/.local/bin/kind"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/kind" version
          kubectl version --client

      - name: OperatorHub install and a real review on kind
        env:
          # Avoids GitHub's anonymous API rate limit when Eagle reads the test PR.
          EAGLE_E2E_GITHUB_TOKEN: ${{ github.token }}
          PRUNE_AFTER_PUSH: "1"
          BUILDX_CACHE: gha
        run: |
          operator/hack/kind-olm-test.sh
          df -h / | tail -1
