name: operator

on:
  push:
    branches: [main]
    paths:
      - "operator/**"
      - "deploy/**"
      - ".github/workflows/operator.yml"
  pull_request:
    paths:
      - "operator/**"
      - "deploy/**"
      - ".github/workflows/operator.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: operator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Generated code and manifests are up to date
        run: make verify

      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Build and vet
        run: |
          go build ./...
          go vet ./...

      - name: Unit, fake client and envtest tests
        run: make test-envtest

      - name: Render operator manifests
        run: make kustomize && bin/kustomize build config/default > /dev/null

      - name: Render deploy/ base
        run: bin/kustomize build ../deploy > /dev/null

      - name: OLM bundle is valid and matches the code
        # make bundle regenerates bundle/ from the API markers and validates it
        # (operatorframework suite). createdAt is a timestamp, so it is ignored.
        run: |
          make bundle
          git diff --exit-code -I 'createdAt:' -- bundle config/manager || {
            echo "bundle/ is out of date: run 'make bundle' in operator/ and commit it"; exit 1; }

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build operator image
        run: podman build -t eagle-operator:ci operator
      - name: Build bundle image
        run: podman build -f operator/bundle.Dockerfile -t eagle-operator-bundle:ci operator
