name: release

# Builds and pushes every image a cluster install needs (linux/amd64):
#   <IMAGE_TAG_BASE>/eagle, eagle-agent-runner, eagle-operator,
#   eagle-operator-bundle and eagle-operator-catalog, all tagged v<version>.
# Then point the cluster's CatalogSource at the catalog image (deploy/README.md).
#
# Repository settings needed:
#   variable IMAGE_TAG_BASE     e.g. quay.io/hmoghani
#   secret   REGISTRY_USERNAME  e.g. a quay.io robot account
#   secret   REGISTRY_PASSWORD

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v, e.g. 0.1.0"
        required: true
      previous_version:
        description: "Version this release upgrades from (keeps it in the catalog). Empty for the first release."
        required: false
        default: ""
      force_e2e:
        description: "Run the cluster test even if it already passed on this commit"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE_TAG_BASE: ${{ vars.IMAGE_TAG_BASE }}
  VERSION: ${{ inputs.version }}
  PREVIOUS_VERSION: ${{ inputs.previous_version }}
  PLATFORM: linux/amd64
  # podman, opm and operator-sdk all read registry credentials from here.
  REGISTRY_AUTH_FILE: ${{ github.workspace }}/.auth.json

jobs:
  # Nothing is published unless the full cluster test passed on this commit:
  # either an earlier e2e run (after the push to main) or the one started here.
  tested:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_e2e }}
        run: |
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=1" --jq .total_count)
          if [[ $FORCE != true && $runs -gt 0 ]]; then
            echo "e2e already passed on $GITHUB_SHA; not running it again"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: tested
    if: needs.tested.outputs.passed != 'true'
    uses: ./.github/workflows/e2e.yml

  release:
    needs: [tested, e2e]
    # e2e is skipped when it already passed on this commit.
    if: >-
      !cancelled() && needs.tested.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check inputs
        run: |
          [[ -n "$IMAGE_TAG_BASE" ]] || { echo "Set the IMAGE_TAG_BASE repository variable"; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must look like 0.1.0"; exit 1; }

      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Log in to the registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          echo "$REGISTRY_PASSWORD" | podman login --authfile "$REGISTRY_AUTH_FILE" \
            -u "$REGISTRY_USERNAME" --password-stdin "${IMAGE_TAG_BASE%%/*}"
          mkdir -p ~/.docker && cp "$REGISTRY_AUTH_FILE" ~/.docker/config.json

      - uses: docker/setup-buildx-action@v3

      - name: Expose the cache service to the build
        uses: crazy-max/ghaction-github-runtime@v3

      - name: App, runner and operator images
        # Same Containerfiles and cache scopes as the e2e run, so layers it
        # built are reused rather than rebuilt.
        run: |
          build() {
            docker buildx build --platform "$PLATFORM" --provenance=false --push \
              --cache-from "type=gha,scope=$1" \
              --cache-to "type=gha,mode=max,scope=$1,ignore-error=true" \
              -t "$IMAGE_TAG_BASE/$1:v$VERSION" -f "$3" "$2"
          }
          build eagle . Containerfile
          build eagle-agent-runner . agent-runner/Containerfile
          build eagle-operator operator operator/Dockerfile

      - name: Bundle
        working-directory: operator
        run: make bundle bundle-build bundle-push IMAGE_TAG_BASE=$IMAGE_TAG_BASE VERSION=$VERSION

      - name: Catalog
        working-directory: operator
        run: |
          make catalog catalog-build catalog-push IMAGE_TAG_BASE=$IMAGE_TAG_BASE VERSION=$VERSION \
            PREVIOUS_VERSION=$PREVIOUS_VERSION

      - name: Summary
        run: |
          {
            echo "### Eagle v$VERSION"
            echo
            for i in eagle eagle-agent-runner eagle-operator eagle-operator-bundle eagle-operator-catalog; do
              echo "- \`$IMAGE_TAG_BASE/$i:v$VERSION\`"
            done
            echo
            echo "Point the cluster's CatalogSource at \`$IMAGE_TAG_BASE/eagle-operator-catalog:v$VERSION\`."
          } >> "$GITHUB_STEP_SUMMARY"
