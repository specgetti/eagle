# Manual deploy of Eagle WITHOUT the operator. Produces the same resources the
# operator would create for a ReviewPlatform named "eagle".
#
# Before applying, create the Secrets described in secrets.example.yaml
# (that file is intentionally NOT listed below) and edit config.env.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eagle

labels:
  - pairs:
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

resources:
  - serviceaccounts.yaml
  - rbac.yaml
  - postgres.yaml
  - web.yaml
  - worker.yaml
  - route.yaml
  - networkpolicies.yaml

configMapGenerator:
  - name: eagle-config
    envs:
      - config.env
  # Optional OIDC SSO (web only). See sso.env and README.md.
  # - name: eagle-sso
  #   envs:
  #     - sso.env

images:
  - name: quay.io/hmoghani/eagle
    newTag: v0.1.0
