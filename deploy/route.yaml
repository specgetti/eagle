apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: eagle-web
  labels:
    app.kubernetes.io/name: eagle
    app.kubernetes.io/instance: eagle
    app.kubernetes.io/component: eagle-web
    app.kubernetes.io/part-of: eagle
spec:
  # Leave host unset to let OpenShift assign one, then copy it into
  # EAGLE_PUBLIC_URL in config.env (see deploy/README.md).
  # host: eagle.apps.example.com
  to:
    kind: Service
    name: eagle-web
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
