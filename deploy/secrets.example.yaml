# EXAMPLE ONLY. Not referenced by kustomization.yaml and never applied by
# `oc apply -k`. Copy it outside the repo, replace every CHANGE_ME, and apply it
# once, or (preferred) use the `oc create secret` commands in deploy/README.md.
#
# Never regenerate eagle-keys after first start: EAGLE_ENCRYPTION_KEY encrypts
# every credential stored in the database, and losing it loses them all.
apiVersion: v1
kind: Secret
metadata:
  name: eagle-keys
type: Opaque
stringData:
  # Any long random string, e.g. `openssl rand -base64 48 | tr '+/' '-_' | tr -d '='`
  EAGLE_SECRET_KEY: CHANGE_ME
  # Fernet key: 32 random bytes, URL safe base64 with padding (44 chars), e.g.
  # `openssl rand -base64 32 | tr '+/' '-_'`
  EAGLE_ENCRYPTION_KEY: CHANGE_ME
---
# Credentials for the bundled Postgres (RHEL image env names).
apiVersion: v1
kind: Secret
metadata:
  name: eagle-db
type: Opaque
stringData:
  POSTGRESQL_USER: eagle
  POSTGRESQL_PASSWORD: CHANGE_ME
  POSTGRESQL_DATABASE: eagle
---
# Full database URL used by web and worker. Must match eagle-db above (or point
# at an external Postgres). URL encode the password if it has special characters.
apiVersion: v1
kind: Secret
metadata:
  name: eagle-database-url
type: Opaque
stringData:
  url: postgresql+asyncpg://eagle:CHANGE_ME@eagle-db:5432/eagle
---
# Optional. Without it the app generates an admin password and logs it once.
apiVersion: v1
kind: Secret
metadata:
  name: eagle-bootstrap-admin
type: Opaque
stringData:
  password: CHANGE_ME
---
# Optional, only for OIDC SSO (see sso.env). Loaded into the web container via envFrom.
apiVersion: v1
kind: Secret
metadata:
  name: eagle-oidc
type: Opaque
stringData:
  EAGLE_OIDC_CLIENT_SECRET: CHANGE_ME
