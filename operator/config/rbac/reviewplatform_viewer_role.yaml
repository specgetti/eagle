apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: reviewplatform-viewer-role
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups: ["eagle.redhat.com"]
    resources: ["reviewplatforms"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["eagle.redhat.com"]
    resources: ["reviewplatforms/status"]
    verbs: ["get"]
